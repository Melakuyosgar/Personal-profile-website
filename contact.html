<head>
    <title>Contact Me</title>
</head>
<body>

    <h1>Contact Me</h1>

    <a href="Home.html">Home</a> 
    <a href="media.html">Media and Interest</a> 
    <a href="contact.html">Contact</a>

    <hr>

    <h2>Send Me a Message</h2>

    <form>

        <p>Full Name:</p>
        <input type="text" name="name" required>

        <p>Email:</p>
        <input type="email" name="email" required>

        <p>Phone:</p>
        <input type="tel" name="phone">

        <p>Date of submission:</p>
        <input type="date" name="date">

        <p>Gender:</p>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female

        <p>Preferred Contact Method:</p>

            <input type="radio" id="emailcontact"
                   name="contactmethod" value="email">
            <label for="emailcontact">Email</label>

            <input type="radio" id="phonecontact"
                   name="contactmethod" value="phone">
            <label for="phonecontact">Phone</label>

            <br>

        <p>Message:</p>
        <textarea name="message" rows="6" cols="35"></textarea>

        <br>
        <input type="submit" value="Send">
        <input type="reset" value="Clear">

    </form>

</body>
</html>
